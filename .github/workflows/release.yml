name: Release

# Publishes a GitHub release when a version tag (v1.2.3) is pushed, using the
# notes in .github/release-notes/<tag>.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=".github/release-notes/${TAG}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing release notes: $notes"
            exit 1
          fi
          gh release create "$TAG" --title "Haul ${TAG}" --notes-file "$notes" --verify-tag --latest
