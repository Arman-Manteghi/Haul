name: Bug report
description: Something in Haul doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a real secret, token or key here.** Haul reports also map where secrets live,
        so share only the lines needed to show the problem, and use fabricated values in examples.
  - type: input
    id: version
    attributes:
      label: Haul version
      description: The output of `haul --version`.
      placeholder: haul 0.2.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: ["Windows 11", "Windows 10", "Linux", "macOS", "Other"]
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: haul --only ai-tools -f html -o report.html
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Include the exit code and any error message (with secrets removed).
    validations:
      required: true
