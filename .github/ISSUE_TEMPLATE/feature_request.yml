name: Feature request
description: Suggest a new scanner, tool, report format or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What should Haul find or do?
      description: For a new tool or credential location, name the tool and where it stores credentials.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter?
      description: How would this help you find or fix exposed secrets?
