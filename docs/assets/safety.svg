<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 318" width="920" height="318" role="img" aria-label="Haul&#x27;s safety layers"><title>Haul&#x27;s safety layers</title><defs><linearGradient id="safe-bg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#151a22"/><stop offset="1" stop-color="#0a0c10"/></linearGradient><radialGradient id="safe-glow" cx="0.5" cy="0.38" r="0.55"><stop offset="0" stop-color="#9686b1" stop-opacity="0.12"/><stop offset="1" stop-color="#9686b1" stop-opacity="0"/></radialGradient><pattern id="safe-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#ffffff" fill-opacity="0.035"/></pattern><linearGradient id="safe-rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7f9cbf" stop-opacity="0"/><stop offset="0.25" stop-color="#7f9cbf"/><stop offset="0.55" stop-color="#9686b1"/><stop offset="0.8" stop-color="#6e9d96"/><stop offset="1" stop-color="#6e9d96" stop-opacity="0"/></linearGradient></defs><rect x="0.5" y="0.5" width="919" height="317" rx="18" fill="url(#safe-bg)" stroke="#262d37"/><rect x="0.5" y="0.5" width="919" height="317" rx="18" fill="url(#safe-dots)"/><rect x="0.5" y="0.5" width="919" height="317" rx="18" fill="url(#safe-glow)"/><rect x="20" y="20" width="880" height="278" rx="14" fill="#7a838f" fill-opacity="0.045" stroke="#7a838f" stroke-opacity="0.55"/><text x="36" y="39" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="700" fill="#7a838f" text-anchor="start" letter-spacing="1.6">BUILD GATES</text><text x="884" y="39" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a2abb6" text-anchor="end">AST lint + canary no-leak test fail the release</text><rect x="60" y="49" width="800" height="238" rx="14" fill="#b46560" fill-opacity="0.045" stroke="#b46560" stroke-opacity="0.55"/><text x="76" y="68" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="700" fill="#b46560" text-anchor="start" letter-spacing="1.6">NETWORK KILL-SWITCH</text><text x="844" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a2abb6" text-anchor="end">audit hook blocks sockets, DNS, subprocesses</text><rect x="100" y="78" width="720" height="198" rx="14" fill="#b48a60" fill-opacity="0.045" stroke="#b48a60" stroke-opacity="0.55"/><text x="116" y="97" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="700" fill="#b48a60" text-anchor="start" letter-spacing="1.6">OUTPUT FIREWALL</text><text x="804" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a2abb6" text-anchor="end">every byte checked against this run&#x27;s secrets</text><rect x="140" y="107" width="640" height="158" rx="14" fill="#a9996a" fill-opacity="0.045" stroke="#a9996a" stroke-opacity="0.55"/><text x="156" y="126" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="700" fill="#a9996a" text-anchor="start" letter-spacing="1.6">FINDING</text><text x="764" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a2abb6" text-anchor="end">refuses to hold a SecretValue, even nested</text><rect x="180" y="136" width="560" height="118" rx="14" fill="#6e9d96" fill-opacity="0.045" stroke="#6e9d96" stroke-opacity="0.55"/><text x="196" y="155" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="700" fill="#6e9d96" text-anchor="start" letter-spacing="1.6">MASKING</text><text x="724" y="155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a2abb6" text-anchor="end">sha256(&quot;haul:v1:&quot; + value) + provider prefix</text><rect x="220" y="165" width="480" height="78" rx="12" fill="#9686b1" fill-opacity="0.16" stroke="#9686b1" stroke-opacity="0.9"/><text x="460" y="201" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#e4e7ec" text-anchor="middle">SecretValue</text><text x="460" y="219" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#a2abb6" text-anchor="middle">repr → &lt;redacted&gt; · no pickle · no copy · constant-time compare</text></svg>
