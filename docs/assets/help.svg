<text x="389" y="25" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8b9099">haul --help</text>
<text y="70.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="7.8" lengthAdjust="spacing" fill="#808080">$</tspan><tspan x="37.6" textLength="85.8" lengthAdjust="spacing" fill="#d4d6db" font-weight="700">haul --help</tspan></text>
<text y="89.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="702.0" lengthAdjust="spacing" fill="#d4d6db">usage: haul [-h] [--home HOME] [--only SCANNERS] [--skip SCANNERS] [--max-depth MAX_DEPTH]</tspan></text>
<text y="108.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="507.0" lengthAdjust="spacing" fill="#d4d6db">            [--verify-format] [--allow-plugins] [--list-scanners]</tspan></text>
<text y="127.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="460.2" lengthAdjust="spacing" fill="#d4d6db">            [-f {csv,html,json,sarif,terminal}] [-o OUTPUT]</tspan></text>
<text y="146.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="468.0" lengthAdjust="spacing" fill="#d4d6db">            [--min-severity {info,low,medium,high,critical}]</tspan></text>
<text y="165.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="702.0" lengthAdjust="spacing" fill="#d4d6db">            [--fail-on {info,low,medium,high,critical}] [--baseline BASELINE] [--no-color]</tspan></text>
<text y="184.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="546.0" lengthAdjust="spacing" fill="#d4d6db">            [-q] [--clean] [--apply] [--yes] [--no-backup] [--version]</tspan></text>
<text y="203.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="179.4" lengthAdjust="spacing" fill="#d4d6db">            [paths ...]</tspan></text>
<text y="241.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="717.6" lengthAdjust="spacing" fill="#d4d6db">Read-only credential-exposure scanner: shows what an infostealer could find on YOUR machine.</tspan></text>
<text y="260.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="725.4" lengthAdjust="spacing" fill="#d4d6db">Never collects, moves, or transmits secret values, and makes no network connections. Use only</tspan></text>
<text y="279.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="351.0" lengthAdjust="spacing" fill="#d4d6db">on systems you own or are authorized to test.</tspan></text>
<text y="317.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="62.4" lengthAdjust="spacing" fill="#d4d6db">options:</tspan></text>
<text y="336.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="429.0" lengthAdjust="spacing" fill="#d4d6db">  -h, --help            show this help message and exit</tspan></text>
<text y="355.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="483.6" lengthAdjust="spacing" fill="#d4d6db">  --version             show program&#x27;s version number and exit</tspan></text>
<text y="393.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="39.0" lengthAdjust="spacing" fill="#d4d6db">scan:</tspan></text>
<text y="412.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="616.2" lengthAdjust="spacing" fill="#d4d6db">  paths                 Extra project directories to include (on this machine).</tspan></text>
<text y="431.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="733.2" lengthAdjust="spacing" fill="#d4d6db">  --home HOME           Scan this home directory instead of yours (e.g. a test fixture). Other</tspan></text>
<text y="450.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="546.0" lengthAdjust="spacing" fill="#d4d6db">                        users&#x27; profiles and network paths are refused.</tspan></text>
<text y="469.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="624.0" lengthAdjust="spacing" fill="#d4d6db">  --only SCANNERS       Run only these scanners (comma-separated or repeatable).</tspan></text>
<text y="488.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="592.8" lengthAdjust="spacing" fill="#d4d6db">  --skip SCANNERS       Skip these scanners (comma-separated or repeatable).</tspan></text>
<text y="507.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="179.4" lengthAdjust="spacing" fill="#d4d6db">  --max-depth MAX_DEPTH</tspan></text>
<text y="526.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="678.6" lengthAdjust="spacing" fill="#d4d6db">                        Directory depth when walking project folders (1-32, default 6).</tspan></text>
<text y="545.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="702.0" lengthAdjust="spacing" fill="#d4d6db">  --verify-format       Offline structural validation to cut false positives (no network).</tspan></text>
<text y="564.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="678.6" lengthAdjust="spacing" fill="#d4d6db">  --allow-plugins       Load third-party scanners from the &#x27;haul.scanners&#x27; entry point.</tspan></text>
<text y="583.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="366.6" lengthAdjust="spacing" fill="#d4d6db">  --list-scanners       List scanners and exit.</tspan></text>
<text y="621.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="54.6" lengthAdjust="spacing" fill="#d4d6db">output:</tspan></text>
<text y="640.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="592.8" lengthAdjust="spacing" fill="#d4d6db">  -f {csv,html,json,sarif,terminal}, --format {csv,html,json,sarif,terminal}</tspan></text>
<text y="659.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="546.0" lengthAdjust="spacing" fill="#d4d6db">                        Output format (repeatable). Default: terminal.</tspan></text>
<text y="678.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="218.4" lengthAdjust="spacing" fill="#d4d6db">  -o OUTPUT, --output OUTPUT</tspan></text>
<text y="697.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="678.6" lengthAdjust="spacing" fill="#d4d6db">                        Write to this file (one format) or directory (several formats).</tspan></text>
<text y="716.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="374.4" lengthAdjust="spacing" fill="#d4d6db">  --min-severity {info,low,medium,high,critical}</tspan></text>
<text y="735.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="553.8" lengthAdjust="spacing" fill="#d4d6db">                        Only report findings at or above this severity.</tspan></text>
<text y="754.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="335.4" lengthAdjust="spacing" fill="#d4d6db">  --fail-on {info,low,medium,high,critical}</tspan></text>
<text y="773.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="725.4" lengthAdjust="spacing" fill="#d4d6db">                        Exit non-zero only if a finding reaches this severity (default: low).</tspan></text>
<text y="792.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="592.8" lengthAdjust="spacing" fill="#d4d6db">  --baseline BASELINE   A previous JSON report; its findings are suppressed.</tspan></text>
<text y="811.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="343.2" lengthAdjust="spacing" fill="#d4d6db">  --no-color            Disable ANSI colors.</tspan></text>
<text y="830.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="686.4" lengthAdjust="spacing" fill="#d4d6db">  -q, --quiet           No banner, progress bar, or informational messages (errors still</tspan></text>
<text y="849.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="241.8" lengthAdjust="spacing" fill="#d4d6db">                        print).</tspan></text>
<text y="887.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="226.2" lengthAdjust="spacing" fill="#d4d6db">clean (opt-in, writes files):</tspan></text>
<text y="906.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="702.0" lengthAdjust="spacing" fill="#d4d6db">  --clean               Redact leaked secrets from AI-tool history you own (dry run unless</tspan></text>
<text y="925.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="257.4" lengthAdjust="spacing" fill="#d4d6db">                        --apply).</tspan></text>
<text y="944.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="694.2" lengthAdjust="spacing" fill="#d4d6db">  --apply               With --clean: actually rewrite files (a backup is written first).</tspan></text>
<text y="963.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="624.0" lengthAdjust="spacing" fill="#d4d6db">  --yes                 With --clean --apply: skip the interactive confirmation.</tspan></text>
<text y="982.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="663.0" lengthAdjust="spacing" fill="#d4d6db">  --no-backup           With --clean --apply: do not write backups (not recommended).</tspan></text>
<text y="1020.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="686.4" lengthAdjust="spacing" fill="#d4d6db">Exit codes: 0 clean (below --fail-on), 1 low, 2 medium, 3 high, 4 critical; 64 usage, 70</tspan></text>
<text y="1039.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13"><tspan x="22.0" textLength="312.0" lengthAdjust="spacing" fill="#d4d6db">internal, 74 I/O error, 130 interrupted.</tspan></text>
</svg>