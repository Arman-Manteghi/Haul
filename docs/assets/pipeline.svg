-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#e4e7ec" text-anchor="start">Mask</text><text x="756" y="261" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#a2abb6" text-anchor="start">fingerprint + prefix</text><line x1="740" y1="245" x2="725" y2="245" stroke="#6c7581" stroke-opacity="0.65" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="562" y="214" width="160" height="62" rx="12" fill="#121721" stroke="#6e9d96" stroke-opacity="0.42"/><rect x="562" y="214" width="160" height="62" rx="12" fill="#6e9d96" fill-opacity="0.06"/><circle cx="580" cy="233" r="9" fill="#6e9d96" fill-opacity="0.18" stroke="#6e9d96" stroke-opacity="0.7"/><text x="580" y="237" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#6e9d96" text-anchor="middle">7</text><text x="596" y="237.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#e4e7ec" text-anchor="start">Score</text><text x="576" y="261" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#a2abb6" text-anchor="start">0–100 · exposure</text><line x1="560" y1="245" x2="545" y2="245" stroke="#6c7581" stroke-opacity="0.65" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="382" y="214" width="160" height="62" rx="12" fill="#121721" stroke="#6e9d96" stroke-opacity="0.42"/><rect x="382" y="214" width="160" height="62" rx="12" fill="#6e9d96" fill-opacity="0.06"/><circle cx="400" cy="233" r="9" fill="#6e9d96" fill-opacity="0.18" stroke="#6e9d96" stroke-opacity="0.7"/><text x="400" y="237" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#6e9