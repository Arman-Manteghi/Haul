" rx="12" fill="#121721" stroke="#7f9cbf" stroke-opacity="0.42"/><rect x="382" y="64" width="160" height="62" rx="12" fill="#7f9cbf" fill-opacity="0.06"/><circle cx="400" cy="83" r="9" fill="#7f9cbf" fill-opacity="0.18" stroke="#7f9cbf" stroke-opacity="0.7"/><text x="400" y="87" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#7f9cbf" text-anchor="middle">3</text><text x="416" y="87.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#e4e7ec" text-anchor="start">Heuristics</text><text x="396" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#a2abb6" text-anchor="start">KEY=… · YAML · JSON · XML</text><line x1="544" y1="95" x2="559" y2="95" stroke="#6c7581" stroke-opacity="0.65" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="562" y="64" width="160" height="62" rx="12" fill="#121721" stroke="#7f9cbf" stroke-opacity="0.42"/><rect x="562" y="64" width="160" height="62" rx="12" fill="#7f9cbf" fill-opacity="0.06"/><circle cx="580" cy="83" r="9" fill="#7f9cbf" fill-opacity="0.18" stroke="#7f9cbf" stroke-opacity="0.7"/><text x="580" y="87" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#7f9cbf" text-anchor="middle">4</text><text x="596" y="87.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#e4e7ec" text-anchor="start">Filters</text><text x="576" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#a2abb6" text-anchor="start">placeholders · refs · IDs</text><line x1="724" y1="95" x2="739" y2="95" stroke="#6c7581" stroke-opacity="0.65" stroke-wi